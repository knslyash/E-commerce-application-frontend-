<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form-box {
            width: 370px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid black;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 7px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .inline {
            display: inline;
            margin-right: 10px;
        }

        button {
            padding: 8px 18px;
            background: white;
            border: 1px solid black;
            cursor: pointer;
        }

        button:hover {
            background: #eee;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h1>Registration Form</h1>

        <form>

            <label>Full Name:</label>
            <input type="text" name="name">

            <label>Email:</label>
            <input type="email" name="email">

            <label>Password:</label>
            <input type="password" name="password">

            <label>Gender:</label>

            <input type="radio" name="gender" value="male">
            <label class="inline">Male</label>

            <input type="radio" name="gender" value="female">
            <label class="inline">Female</label>

            <br><br>

            <label>Hobbies:</label>

            <input type="checkbox" name="hobby" value="reading">
            <label class="inline">Reading</label>

            <input type="checkbox" name="hobby" value="sports">
            <label class="inline">Sports</label>

            <input type="checkbox" name="hobby" value="coding">
            <label class="inline">Coding</label>

            <br><br>

            <label>Course:</label>

            <select name="course">
                <option>B.Tech</option>
                <option>BCA</option>
                <option>MCA</option>
                <option>M.Tech</option>
            </select>

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
