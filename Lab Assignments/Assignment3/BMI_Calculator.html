<!DOCTYPE html>
<html>
<head>
  <title>BMI Calculator</title>
  <!-- Name: Yash Kumar | Section: NB | Lab Assignment-3 | Task 1 -->
</head>
<body>
  <h2>BMI Calculator</h2>

  Height (in cm): <input type="number" id="height"><br><br>
  Weight (in kg): <input type="number" id="weight"><br><br>
  <button onclick="calculateBMI()">Calculate BMI</button>

  <h3 id="result"></h3>

  <script>
    function calculateBMI() {
      var height = document.getElementById("height").value;
      var weight = document.getElementById("weight").value;
      var result = document.getElementById("result");

      if (height <= 0 || weight <= 0 || height == "" || weight == "") {
        result.innerText = "Please enter valid height and weight";
        return;
      }

      // convert height from cm to metre
      var h = height / 100;
      var bmi = weight / (h * h);

      var category = "";
      if (bmi < 18.5) {
        category = "Underweight";
      } else if (bmi < 25) {
        category = "Normal";
      } else {
        category = "Overweight";
      }

      result.innerText = "Your BMI is " + bmi.toFixed(2) + " (" + category + ")";
    }
  </script>
</body>
</html>
