<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: white;
        margin: 40px;
    }
    h2 {
        text-align: center;
    }
    form {
        width: 300px;
        margin: auto;
        border: 1px solid black;
        padding: 20px;
    }
    label {
        display: block;
        margin-top: 12px;
        margin-bottom: 4px;
        font-weight: bold;
    }
    input[type="text"],
    input[type="password"] {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
    }
    input[type="submit"] {
        margin-top: 20px;
        padding: 8px 16px;
    }
</style>
</head>
<body>

<h2>Login</h2>

<form>

    <label for="username">Username:</label>
    <input type="text" id="username" name="username">

    <label for="password">Password:</label>
    <input type="password" id="password" name="password">

    <input type="submit" value="Login">

</form>

</body>
</html>
